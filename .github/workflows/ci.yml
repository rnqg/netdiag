name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Allocate temporary workspace
        run: |
          task_temp=$(mktemp -d)
          if command -v cygpath >/dev/null 2>&1; then
            task_temp=$(cygpath -m "$task_temp")
          fi
          mkdir -p "$task_temp/temp"
          echo "GOTMPDIR=$task_temp/temp" >> "$GITHUB_ENV"
          echo "TMPDIR=$task_temp/temp" >> "$GITHUB_ENV"
          echo "TMP=$task_temp/temp" >> "$GITHUB_ENV"
          echo "TEMP=$task_temp/temp" >> "$GITHUB_ENV"
          echo "TASK_TEMP=$task_temp" >> "$GITHUB_ENV"
          echo "GOCACHE=$task_temp/cache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$task_temp/modules" >> "$GITHUB_ENV"
          echo "GOPATH=$task_temp/path" >> "$GITHUB_ENV"
          echo "TEST_TELEMETRY_DIR=$task_temp/telemetry" >> "$GITHUB_ENV"
      - run: go test -race -timeout 3m ./...
        env:
          NETDIAG_TEST_ELEVATION: "1"
      - run: go vet ./...
      - name: Build both architectures
        run: |
          for target_arch in amd64 arm64; do
            GOARCH="$target_arch" CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$TASK_TEMP/bin/$target_arch/" ./cmd/...
          done
      - name: Clean temporary workspace
        if: always()
        run: |
          if [ -n "$TASK_TEMP" ] && [ -d "$TASK_TEMP" ]; then
            chmod -R u+w "$TASK_TEMP"
            rm -rf "$TASK_TEMP"
          fi
