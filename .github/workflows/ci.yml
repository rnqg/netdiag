name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Allocate temporary workspace
        run: |
          task_temp=$(mktemp -d)
          if command -v cygpath >/dev/null 2>&1; then
            task_temp=$(cygpath -m "$task_temp")
          fi
          mkdir -p "$task_temp/temp"
          echo "GOTMPDIR=$task_temp/temp" >> "$GITHUB_ENV"
          echo "TMPDIR=$task_temp/temp" >> "$GITHUB_ENV"
          echo "TMP=$task_temp/temp" >> "$GITHUB_ENV"
          echo "TEMP=$task_temp/temp" >> "$GITHUB_ENV"
          echo "TASK_TEMP=$task_temp" >> "$GITHUB_ENV"
          echo "GOCACHE=$task_temp/cache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$task_temp/modules" >> "$GITHUB_ENV"
          echo "GOPATH=$task_temp/path" >> "$GITHUB_ENV"
          echo "TEST_TELEMETRY_DIR=$task_temp/telemetry" >> "$GITHUB_ENV"
      - run: go test -race -timeout 3m ./...
        env:
          NETDIAG_TEST_ELEVATION: "1"
      - run: go vet ./...
      - name: Build both architectures
        run: |
          for target_arch in amd64 arm64; do
            GOARCH="$target_arch" CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$TASK_TEMP/bin/$target_arch/" ./cmd/...
          done
      - name: Check full report against the containerized node
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          fixture="$TASK_TEMP/container"
          mkdir -p "$fixture"
          image="netdiag-check:$GITHUB_RUN_ID"
          container="netdiag-check-$GITHUB_RUN_ID"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext 'subjectAltName=IP:127.0.0.1' -out "$fixture/cert.pem" -keyout "$fixture/key.pem" 2>/dev/null
          chmod a+r "$fixture/cert.pem" "$fixture/key.pem"
          export NETDIAG_NODE_TOKEN
          NETDIAG_NODE_TOKEN=$(openssl rand -hex 32)
          docker build -q -t "$image" .
          docker run -d --name "$container" --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges --env NETDIAG_NODE_TOKEN \
            --mount "type=bind,source=$fixture/cert.pem,target=/cert.pem,readonly" \
            --mount "type=bind,source=$fixture/key.pem,target=/key.pem,readonly" \
            "$image" --listen 127.0.0.1:0 --udp 127.0.0.1:0 --cert /cert.pem --key /key.pem --max-mib 16
          endpoint=""
          for attempt in $(seq 1 20); do
            endpoint=$(docker logs "$container" 2>&1 | sed -n 's/.*HTTPS.* \(127\.0\.0\.1:[0-9][0-9]*\);.*/\1/p')
            if [ -n "$endpoint" ]; then break; fi
            sleep 1
          done
          test -n "$endpoint"
          status=$(curl -sS --noproxy '*' --cacert "$fixture/cert.pem" -o /dev/null -w '%{http_code}' "https://$endpoint/v1/capabilities")
          test "$status" = 401
          mkdir "$fixture/web"
          python3 -u -m http.server 0 --bind 127.0.0.1 --directory "$fixture/web" >"$fixture/http.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true; docker rm -f "$container" >/dev/null 2>&1 || true; docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          web_port=""
          for attempt in $(seq 1 20); do
            web_port=$(sed -n 's/.* port \([0-9][0-9]*\) .*/\1/p' "$fixture/http.log")
            if [ -n "$web_port" ]; then break; fi
            sleep 1
          done
          test -n "$web_port"
          code=0
          SSL_CERT_FILE="$fixture/cert.pem" "$TASK_TEMP/bin/amd64/netdiag" check --full --mode direct \
            --only-target --target "http://127.0.0.1:$web_port" --node "https://$endpoint" \
            --max-mib 16 --duration 2s --format json > "$fixture/report.json" || code=$?
          python3 - "$fixture/report.json" "$code" <<'PYVERIFY'
          import json
          import sys

          with open(sys.argv[1]) as report:
              data = json.load(report)
          rows = data["measurements"]
          assert sys.argv[2] == "3" and data["full"] and data["partial"], data["findings"]
          assert not data["network_changed"], data["findings"]
          assert any(row["kind"] == "http_baseline" and row["status"] == "ok" for row in rows)
          assert any(row["id"] == "quality/quality-udp" and row["statistics"]["received"] > 0 for row in rows)
          phases = [row for row in rows if row["kind"] == "bufferbloat"]
          assert {row["data"]["phase"] for row in phases} == {"download", "upload", "both"}, phases
          assert any(row["kind"] == "throughput" and row["status"] == "limited" for row in rows)
          assert len({row["id"] for row in rows}) == len(rows)
          PYVERIFY
      - name: Clean temporary workspace
        if: always()
        run: |
          if [ -n "$TASK_TEMP" ] && [ -d "$TASK_TEMP" ]; then
            chmod -R u+w "$TASK_TEMP"
            rm -rf "$TASK_TEMP"
            echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
            echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
            echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
            echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi
